<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CajaMaster POS | Generador de Claves</title>
  <meta name="description" content="Generador oficial offline de licencias y contraseñas criptográficas para CajaMaster POS.">
  
  <!-- Apple Web App & Icon configuration for Mac Desktop and iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CajaMaster POS">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'%3E%3Cpath d='M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5-1.5 1.5 1.5 1.5-1.5 1.5 1.5 1.5-1.5 1.5-2-2-1.5 1.5c-2.8-1.4-6.3-.7-8.3 1.3-2.3 2.3-2.3 6.1 0 8.5 2.3 2.3 6.1 2.3 8.5 0 2-2 2.7-5.5 1.3-8.3l1.5-1.5 1.5 1.5 1.5-1.5-1.5-1.5 1.5-1.5-1.5-1.5 2-2z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%238b5cf6'/%3E%3Cpath d='M70 25 L60 35 L52 27 L45 34 L53 42 L45 50 L53 58 L40 45 L32 53 C22 47 9 52 3 62 C-4 72 1 85 11 91 C21 97 34 92 40 82 C46 72 41 59 35 49 L43 41 L51 49 L59 41 L51 33 L62 22 Z' fill='white'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #080c16;
      --card-bg: #0f1629;
      --card-border: #1a243c;
      --input-bg: #090d18;
      --input-border: #1e2b48;
      --text-main: #f8fafc;
      --text-muted: #8493ad;
      --text-sub: #546585;
      --purple-main: #a855f7;
      --purple-hover: #9333ea;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --purple-badge-bg: #3b0764;
      --purple-badge-border: #701a75;
      --pink-neon: #e879f9;
      --btn-bg: #162035;
      --btn-border: #243456;
      --btn-hover: #1e2c4a;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% -10%, #172342 0%, #080c16 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 60px;
    }

    .app-container {
      width: 100%;
      max-width: 490px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Brand Header */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px var(--purple-glow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .brand-icon-wrapper svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
      transform: rotate(-10deg);
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .brand-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(30, 58, 138, 0.35);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Cards */
    .card {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    /* Generator Form Header */
    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .form-required {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--pink-neon);
      letter-spacing: 0.5px;
    }

    /* Input Field */
    .input-box {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--purple-main);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }

    .input-icon {
      padding-left: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
    }

    .input-icon svg {
      width: 20px;
      height: 20px;
    }

    .device-input {
      width: 100%;
      padding: 14px 14px 14px 10px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .device-input::placeholder {
      color: #3b4b68;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    .btn-paste {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .btn-paste:hover {
      color: var(--pink-neon);
    }

    /* Key Output Box */
    .output-box {
      margin-top: 18px;
      padding: 22px 16px;
      background-color: var(--input-bg);
      border: 1px dashed var(--input-border);
      border-radius: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .output-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-sub);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .output-key {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--pink-neon);
      text-shadow: 0 0 25px rgba(232, 121, 249, 0.4);
      user-select: all;
      word-break: break-all;
      transition: all 0.2s ease;
    }

    .output-key.placeholder {
      color: #2b3952;
      letter-spacing: 4px;
      text-shadow: none;
      font-size: 1.35rem;
    }

    /* Action Buttons Row */
    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 13px 16px;
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background-color: var(--btn-hover);
      border-color: #3b4f7a;
      transform: translateY(-1px);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    .btn-action svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .btn-share-square {
      flex: 0 0 52px;
      padding: 13px 0;
    }

    /* History Card */
    .history-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .history-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
    }

    .history-title-group svg {
      width: 18px;
      height: 18px;
      color: #60a5fa;
    }

    .btn-clear-all {
      background: none;
      border: none;
      color: #f87171;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }

    .btn-clear-all:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* Search Input */
    .search-box {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .search-box svg {
      margin-left: 12px;
      width: 16px;
      height: 16px;
      color: var(--text-sub);
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .search-input::placeholder {
      color: #3b4b68;
    }

    /* History List */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #1e2b48;
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: #0c1120;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      transition: border-color 0.2s;
    }

    .history-item:hover {
      border-color: rgba(168, 85, 247, 0.3);
    }

    .history-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      margin-right: 10px;
    }

    .history-device-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-date {
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .history-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .history-key-badge {
      background-color: var(--purple-badge-bg);
      border: 1px solid var(--purple-badge-border);
      color: var(--pink-neon);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 8px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .history-key-badge:hover {
      transform: scale(1.03);
    }

    .history-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s;
    }

    .history-icon-btn:hover {
      color: var(--text-main);
    }

    .history-icon-btn.btn-del:hover {
      color: var(--danger);
    }

    .history-icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .history-empty {
      text-align: center;
      padding: 24px 0;
      color: var(--text-sub);
      font-size: 0.82rem;
    }

    /* Save to Mac Download Bar */
    .save-mac-box {
      width: 100%;
      margin-top: 10px;
      padding: 14px 18px;
      background: rgba(22, 32, 53, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .save-mac-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .save-mac-text strong {
      color: #ffffff;
      display: block;
      font-size: 0.82rem;
    }

    .btn-download-mac {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn-download-mac:hover {
      opacity: 0.9;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #10b981;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1000;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.9) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="brand-icon-wrapper">
        <!-- SVG Key Icon matching screenshot -->
        <svg viewBox="0 0 24 24">
          <path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5-1.5 1.5 1.5 1.5-1.5 1.5 1.5 1.5-1.5 1.5-2-2-1.5 1.5c-2.8-1.4-6.3-.7-8.3 1.3-2.3 2.3-2.3 6.1 0 8.5 2.3 2.3 6.1 2.3 8.5 0 2-2 2.7-5.5 1.3-8.3l1.5-1.5 1.5 1.5 1.5-1.5-1.5-1.5 1.5-1.5-1.5-1.5 2-2z"/>
        </svg>
      </div>
      <h1 class="brand-title">CajaMaster POS</h1>
      <span class="brand-badge">GENERADOR DE CLAVES</span>

    <!-- Generator Card -->
    <section class="card">
      <div class="form-header">
        <span class="form-label">ID DEL DISPOSITIVO</span>
        <span class="form-required">* OBLIGATORIO</span>
      </div>

      <div class="input-box">
        <div class="input-icon">
          <!-- Device / Phone Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <input
          type="text"

      <!-- Action Buttons -->

            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>

          <!-- Rotate / History Clock Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>

        <button type="button" class="btn-clear-all" onclick="clearAllHistory()">
          <!-- Trash Icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <input

    <!-- Save to Mac helper bar -->

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <polyline points="7 10 12 15 17 10"></polyline>

  <!-- Toast Notification -->
  <div class="toast" id="toastMessage">✓ ¡Clave copiada al portapapeles!</div>

  <script>
    // Exact cryptographic secret salt used by CajaMaster POS
    const SECRET_KEY = "MiClaveSuperSecretaDelPuntoDeVenta2026";
    const HISTORY_STORAGE_KEY = "cajamaster_admin_history_v1";

    let currentCalculatedKey = "";

    // Web Crypto API: Standard HMAC-SHA256
    async function calculateHmacSha256(keyStr, messageStr) {
      const enc = new TextEncoder();
      const keyBytes = enc.encode(keyStr);
      const msgBytes = enc.encode(messageStr.trim().toLowerCase());

      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        keyBytes,
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );

      const sig = await crypto.subtle.sign("HMAC", cryptoKey, msgBytes);
      const hashArray = Array.from(new Uint8Array(sig));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Real-time generator function
    async function updateGenerator() {
      const input = document.getElementById('deviceIdInput');
      const display = document.getElementById('licenseKeyDisplay');
      const rawVal = (input.value || "").trim();

      if (!rawVal) {
        display.innerText = "- - - - - - - - - - - -";
        display.classList.add("placeholder");
        currentCalculatedKey = "";
        return;
      }

      try {
        const hash = await calculateHmacSha256(SECRET_KEY, rawVal);
        const rawCode = hash.substring(0, 12).toUpperCase();
        const formattedCode = `${rawCode.slice(0, 4)}-${rawCode.slice(4, 8)}-${rawCode.slice(8, 12)}`;

        currentCalculatedKey = formattedCode;
        display.innerText = formattedCode;
        display.classList.remove("placeholder");

        // Save to history when length looks like a full Device ID (>= 6 chars)
        if (rawVal.length >= 6) {
          saveToHistory(rawVal.toUpperCase(), formattedCode);
        }
      } catch (err) {
        console.error("HMAC calculation error:", err);
      }
    }

    const deviceInput = document.getElementById('deviceIdInput');
    deviceInput.addEventListener('input', updateGenerator);
    deviceInput.addEventListener('paste', () => setTimeout(updateGenerator, 50));

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          deviceInput.value = text.trim();
          updateGenerator();
          showToast("✓ ID pegado desde el portapapeles");
        }
      } catch {
        deviceInput.focus();
        showToast("Presiona Cmd+V para pegar");
      }
    }

    function copyCurrentKey() {
      if (!currentCalculatedKey) {
        showToast("⚠️ Ingresa un ID de dispositivo primero");
        deviceInput.focus();
        return;
      }
      navigator.clipboard.writeText(currentCalculatedKey).then(() => {
        showToast("✓ ¡Clave copiada: " + currentCalculatedKey + "!");
      }).catch(() => {
        showToast("✓ " + currentCalculatedKey);
      });
    }

    function shareOrWhatsApp() {
      if (!currentCalculatedKey) {
        showToast("⚠️ Ingresa un ID de dispositivo primero");
        return;
      }
      const deviceId = deviceInput.value.trim().toUpperCase();
      const msg = `Hola, aquí tienes tu clave de activación oficial para *CajaMaster POS*:\n\n🔑 Clave: *${currentCalculatedKey}*\n📱 Dispositivo: ${deviceId}\n\nIngresa este código en la pantalla de activación de tu punto de venta.`;

      if (navigator.share) {
        navigator.share({
          title: 'Licencia CajaMaster POS',
          text: msg
        }).catch(() => {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        });
      } else {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      toast.innerText = msg;
      toast.style.display = 'block';
      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        toast.style.display = 'none';
      }, 2600);
    }

    // --- History Persistence ---
    function getHistoryList() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveToHistory(deviceId, key) {
      let list = getHistoryList();
      list = list.filter(item => item.deviceId !== deviceId);
      
      const now = new Date();
      const dateStr = now.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

      list.unshift({
        deviceId,
        key,
        date: `${dateStr}, ${timeStr}`
      });

      if (list.length > 50) list = list.slice(0, 50);
      localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
      renderHistory();
    }

    function deleteHistoryItem(deviceId) {
      let list = getHistoryList();
      list = list.filter(item => item.deviceId !== deviceId);
      localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
      renderHistory();
      showToast("Elemento eliminado");
    }

    function clearAllHistory() {
      if (confirm("¿Deseas eliminar todo el historial de claves generadas?")) {
        localStorage.removeItem(HISTORY_STORAGE_KEY);
        renderHistory();
        showToast("Historial vaciado");
      }
    }

    function copySpecificKey(key) {
      navigator.clipboard.writeText(key).then(() => {
        showToast("✓ Clave copiada: " + key);
      });
    }

    function renderHistory() {
      const container = document.getElementById('historyContainer');
      const searchTerm = (document.getElementById('historySearchInput').value || "").toLowerCase().trim();
      let list = getHistoryList();

      if (searchTerm) {
        list = list.filter(i => i.deviceId.toLowerCase().includes(searchTerm) || i.key.toLowerCase().includes(searchTerm));
      }

      if (!list || list.length === 0) {
        container.innerHTML = `<div class="history-empty">No hay registros de claves aún</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="history-item">
          <div class="history-left">
            <span class="history-device-id" title="${item.deviceId}">${item.deviceId}</span>
            <span class="history-date">📅 ${item.date}</span>
          </div>
          <div class="history-right">
            <span class="history-key-badge" onclick="copySpecificKey('${item.key}')" title="Clic para copiar">${item.key}</span>
            <button type="button" class="history-icon-btn" onclick="copySpecificKey('${item.key}')" title="Copiar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button type="button" class="history-icon-btn btn-del" onclick="deleteHistoryItem('${item.deviceId}')" title="Eliminar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Download standalone file for Mac
    function downloadCurrentHtml() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Generador_CajaMaster_POS.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("✓ Archivo descargado para tu Mac");
    }

    // Seed default sample if history is totally empty
    if (getHistoryList().length === 0) {
      saveToHistory("CM-ZFIQ-I7KK-LX0B", "B468-5445-1AA9");
    } else {
      renderHistory();
    }
  </script>
</body>
</html>
