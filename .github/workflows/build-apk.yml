# Compila el APK de Android en la nube de GitHub (sin Mac, sin Android Studio).
#
# - Al fusionar en main (o con el botón "Run workflow" en Actions): compila el APK y lo
#   publica en "Releases" con un enlace para descargarlo directamente desde el teléfono.
# - En cada pull request: lo compila como comprobación y lo deja como artefacto descargable.
#
# Firma:
# - Si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD, genera un APK de producción firmado con tu llave.
# - Si no, genera un APK de prueba (debug). La llave de prueba se conserva entre compilaciones
#   con la caché de GitHub para que las versiones se puedan instalar una encima de otra.
name: Compilar APK Android

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "android/**", "package.json", "version.json", "capacitor.config.ts", "vite.config.ts", "index.html", ".github/workflows/build-apk.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El SDK de Android ya viene instalado en los servidores de GitHub (ANDROID_HOME);
      # solo aceptamos las licencias para que Gradle pueda descargar la plataforma que falte.
      - name: Preparar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Llave de firma de prueba (estable entre compilaciones)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cajamaster-debug-keystore-v1

      - name: Leer versión
        id: ver
        run: |
          echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./version.json').versionCode")" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar la app y copiarla a Android
        env:
          VITE_ELTOQUE_TOKEN: ${{ secrets.ELTOQUE_TOKEN }}
        run: npm run cap:build

      - name: Llave de firma de producción (si está configurada)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Preparar archivo
        id: out
        run: |
          MODE="${{ steps.sign.outputs.mode }}"
          SRC=$(ls android/app/build/outputs/apk/$MODE/*.apk | head -1)
          NAME="CajaMaster-${{ steps.ver.outputs.version }}-$MODE.apk"
          mkdir -p out && cp "$SRC" "out/$NAME"
          ls -lh out
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: out/${{ steps.out.outputs.name }}
          retention-days: 30

      - name: Publicar en Releases (descarga directa desde el teléfono)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ steps.ver.outputs.version }}-${{ github.run_number }}"
          gh release create "$TAG" "out/${{ steps.out.outputs.name }}" \
            --title "APK CajaMaster ${{ steps.ver.outputs.version }} (compilación ${{ github.run_number }})" \
            --notes "APK ${{ steps.sign.outputs.mode == 'release' && 'firmado de producción' || 'de prueba (debug)' }} generado automáticamente desde ${{ github.sha }}. Descárgalo desde el teléfono y ábrelo para instalarlo." \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Resumen
        run: |
          echo "### APK listo: ${{ steps.out.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Modo de firma: **${{ steps.sign.outputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"
